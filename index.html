<!DOCTYPE html>
<!--
  ================================================================
  ENTER BREDA – TECH QUIZ
  Eén zelfstandig bestand, werkt volledig offline.
  ================================================================

  HOE PAS IK DINGEN AAN?
  Open dit bestand in een teksteditor (bijv. Kladblok, TextEdit in
  "platte tekst"-modus, of Visual Studio Code). Sla daarna op en
  open het bestand opnieuw in de browser.

  1. KLEUREN
     Zoek het blok "KLEUREN" (direct hieronder in <style>).
     Vervang alleen de kleurcodes, bijv. #773dbd.

  2. TEKSTEN (startscherm, knoppen, eindboodschappen)
     Zoek het blok "CONFIGURATIE" en daarin "teksten" en "scores".
     Verander alleen de tekst TUSSEN de aanhalingstekens "...".
     Wil je aanhalingstekens ín een tekst? Gebruik dan “ ” of ‘ ’.
     Teksten met "TIJDELIJK" erboven zijn voorlopige teksten.
     {nummer}, {totaal} en {score} worden automatisch ingevuld:
     laat die woorden met accolades staan.

  3. VRAGEN
     Zoek "vragen" in het CONFIGURATIE-blok. Elke vraag heeft:
       vraag:       de vraagtekst
       antwoorden:  een lijst met antwoorden; het goede antwoord
                    heeft  goed: true  (de rest  goed: false)
       toelichting: de uitleg die na het antwoorden verschijnt
       uitleg:      (optioneel, bij een fout antwoord) waarom dát
                    antwoord niet klopt. Verschijnt alleen als
                    iemand dat foute antwoord kiest, als inklapbaar
                    "Waarom niet?"-blok. Niet nodig?
                    Laat het dan weg.
     De volgorde van de antwoorden wordt automatisch geschud.
     Je kunt vragen toevoegen of verwijderen; de voortgangsbalk
     en de score passen zich vanzelf aan. Pas dan wel de
     scorebereiken (scores) aan.
     Let op de komma's tussen de vragen en antwoorden.

  4. LOGO
     Zoek  LOGO_BASE64 = ""  onderaan het CONFIGURATIE-blok.
     Zet daar je logo als base64 tussen de aanhalingstekens.
     Volledige vorm (aanbevolen):
       "data:image/png;base64,iVBORw0KGgo..."
       "data:image/svg+xml;base64,PHN2Zy..."
     Zonder "data:..."-begin gaan we uit van een PNG.
     Op het paarse startscherm staat het logo op een wit vlak,
     zodat het paarse "BREDA" altijd zichtbaar is.
     Leeg laten = er staat een "LOGO"-placeholder.
     Nu ingevuld met het aangeleverde Enter Breda-logo (PNG,
     bijgesneden en met wat ruimte eromheen).
     Spaties en regeleinden in de base64-tekst mogen: die worden
     automatisch weggehaald.
     (Base64 maken: zoek op "image to base64 converter", of in een
      terminal:  base64 -i logo.png )

  5. LETTERTYPE (bijv. Sailec uit het brandbook)
     Zoek  FONT_BASE64_REGULAR / _MEDIUM / _BOLD.
     Nu ingevuld: Sailec Regular en Sailec Bold (.otf, dus
     FONT_FORMAAT = "opentype"). Ander formaat? Pas FONT_FORMAAT
     aan: .woff2 = "woff2", .woff = "woff", .ttf = "truetype".
     Leeg laten = nette systeemletter.
     Controleer of je licentie inbedden toestaat.

  6. QR-CODE (eindscherm)
     Zoek  QR_BASE64  (onder LOGO_ALT). Werkt net als het logo.
     Leeg laten = het QR-blok verdwijnt. De teksten ernaast staan
     bij "teksten" als qrTitel en qrTekst.

  7. OVERIG
     inactiviteitSeconden: na hoeveel seconden zonder aanraking de
     quiz terug naar het startscherm gaat (standaard 60).
     confettiVanafScore: vanaf welke score er confetti is.
     geluidStandaardAan: true of false.

  PRIVACY: de quiz bewaart niets (geen namen, geen opslag, geen
  localStorage). Na herladen of inactiviteit is alles weg.

  TIP IPAD: zet "Begeleide toegang" (Guided Access) aan zodat
  bezoekers de quiz niet kunnen verlaten. Let op: met de stil-
  schakelaar/stille modus aan speelt Safari geen geluid af.
  ================================================================
-->

<style>
:root {
  --font: "QuizFont", "Sailec", -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --radius: 20px;
  --ease-out: cubic-bezier(.2, .8, .2, 1);
  --ease-spring: cubic-bezier(.34, 1.56, .64, 1);
  --ease-smooth: cubic-bezier(.25, 1, .5, 1);
  --dur-reveal: .5s;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
  touch-action: manipulation;
}

html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body {
  position: fixed;
  inset: 0;
  background: var(--grijs);
  color: var(--paars-donker);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

button { font-family: inherit; color: inherit; }
button:focus { outline: none; }
button:focus-visible { outline: 4px solid var(--lime); outline-offset: 4px; }

#app { position: absolute; inset: 0; overflow: hidden; }

/* ---------- schermen & overgangen ---------- */
.screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  overflow-anchor: none;
  padding:
    max(24px, env(safe-area-inset-top))
    max(24px, env(safe-area-inset-right))
    max(24px, env(safe-area-inset-bottom))
    max(24px, env(safe-area-inset-left));
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transform: translateY(28px) scale(.985);
  transition: opacity .5s var(--ease-out), transform .5s var(--ease-out), visibility 0s linear .5s;
}
.screen.active {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
  transform: none;
  transition: opacity .5s var(--ease-out), transform .5s var(--ease-out), visibility 0s;
}
.screen-inner {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 1000px;
  margin: auto;
}

/* ---------- pixel-decoratie (brandbook: visual elements) ---------- */
.pixels {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  width: 100%;
  height: 24%;
  z-index: 0;
  pointer-events: none;
}

/* ---------- logo ---------- */
.logo img {
  display: block;
  height: 100%;
  width: auto;
  max-width: 100%;
  object-fit: contain;
  pointer-events: none;
}
/* op paars: logo op een wit vlak, zodat het paarse "BREDA" zichtbaar blijft */
.logo-big.has-img {
  height: auto;
  padding: clamp(8px, 1.4vh, 14px) clamp(12px, 2vh, 20px);
  background: var(--wit);
  border-radius: 18px;
  box-shadow: 0 6px 0 var(--paars-donker);
}
.logo-big.has-img img { height: clamp(64px, 12.5vh, 128px); }
.logo-placeholder {
  height: 100%;
  aspect-ratio: 2.6 / 1;
  border: 3px dashed currentColor;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: .4em;
  font-weight: 700;
  letter-spacing: .14em;
  opacity: .85;
}
.logo-placeholder svg { height: 46%; width: auto; }
.logo-big   { height: clamp(64px, 13vh, 130px); color: var(--wit); }
.logo-small { height: 60px; color: var(--paars); flex: none; }
.logo-small .logo-placeholder { font-size: 15px; border-width: 2px; border-radius: 10px; }
.logo-big .logo-placeholder   { font-size: clamp(16px, 2.2vh, 22px); }

/* ---------- knoppen ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  min-height: 76px;
  padding: 12px 44px;
  border: 0;
  border-radius: var(--radius);
  font-size: clamp(22px, 2.6vw, 30px);
  font-weight: 700;
  line-height: 1.1;
  cursor: pointer;
  transition: transform .09s ease, box-shadow .09s ease, filter .09s ease;
}
.btn svg { width: 1.1em; height: 1.1em; flex: none; }
.btn-lime {
  background: var(--lime);
  color: var(--paars-diep);
  box-shadow: 0 8px 0 var(--lime-donker), 0 16px 28px rgba(0,0,0,.22);
}
.btn-lime:active {
  transform: translateY(6px);
  box-shadow: 0 2px 0 var(--lime-donker), 0 6px 10px rgba(0,0,0,.2);
  filter: brightness(.96);
}
.btn-paars {
  background: var(--paars);
  color: var(--wit);
  box-shadow: 0 7px 0 var(--paars-donker), 0 14px 22px rgba(61,26,110,.25);
}
.btn-paars:active {
  transform: translateY(5px);
  box-shadow: 0 2px 0 var(--paars-donker), 0 4px 8px rgba(61,26,110,.2);
  filter: brightness(.95);
}
.btn-pulse { animation: pulse 2.4s ease-in-out infinite; }
.btn-pulse:active { animation: none; }

/* ---------- geluidsknop ---------- */
#soundBtn {
  position: fixed;
  top: max(16px, env(safe-area-inset-top));
  right: max(16px, env(safe-area-inset-right));
  z-index: 50;
  width: 64px;
  height: 64px;
  border: 0;
  border-radius: 50%;
  display: grid;
  place-items: center;
  cursor: pointer;
  background: rgba(255,255,255,.16);
  color: var(--wit);
  transition: background .3s, color .3s, transform .09s;
}
#soundBtn:active { transform: scale(.9); }
#soundBtn svg { width: 30px; height: 30px; }
#soundBtn .ico-off { display: none; }
#soundBtn.muted .ico-on { display: none; }
#soundBtn.muted .ico-off { display: block; }
body[data-screen="quiz"] #soundBtn {
  background: var(--wit);
  color: var(--paars);
  box-shadow: 0 4px 0 var(--paars-licht);
}

/* ---------- startscherm ---------- */
#start, #end { background: var(--paars); color: var(--wit); }
.center-stack {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: clamp(14px, 2.6vh, 30px);
  padding-bottom: clamp(40px, 11vh, 120px);
}
.kicker {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  color: var(--lime);
  font-weight: 700;
  font-size: clamp(18px, 2.2vw, 24px);
  letter-spacing: .1em;
  text-transform: uppercase;
}
.kicker::before, .kicker::after {
  content: "";
  width: 12px; height: 12px;
  background: currentColor;
  box-shadow: 16px 0 0 var(--wit);
}
.kicker::after { box-shadow: -16px 0 0 var(--wit); }
.kicker::before { margin-right: 16px; }
.kicker::after  { margin-left: 16px; }
.start-title {
  margin: 0;
  font-size: clamp(44px, min(8.5vw, 11vh), 104px);
  line-height: 1.02;
  font-weight: 700;
  letter-spacing: -.025em;
  text-wrap: balance;
  max-width: 14ch;
}
.start-text {
  margin: 0;
  max-width: 34ch;
  font-size: clamp(20px, min(2.6vw, 3.3vh), 28px);
  line-height: 1.4;
  text-wrap: pretty;
}
#start.active .anim-in { animation: rise .7s var(--ease-out) backwards; }
#start.active .anim-in:nth-child(2) { animation-delay: .08s; }
#start.active .anim-in:nth-child(3) { animation-delay: .16s; }
#start.active .anim-in:nth-child(4) { animation-delay: .24s; }
#start.active .anim-in:nth-child(5) { animation-delay: .34s; }
#start.active .anim-in:nth-child(6) { animation-delay: .44s; }

.config-warn {
  display: none;
  max-width: 640px;
  padding: 14px 18px;
  border-radius: 12px;
  background: #fff3c4;
  color: #5c4500;
  font-size: 17px;
  text-align: left;
  line-height: 1.4;
}
.config-warn.show { display: block; }

/* ---------- quizscherm ---------- */
#quiz { background: var(--grijs); }
.quiz-top {
  display: flex;
  align-items: center;
  gap: clamp(16px, 3vw, 32px);
  padding-right: 80px;
  min-height: 64px;
}
.progress { flex: 1; min-width: 0; }
.progress-label {
  font-size: clamp(18px, 2vw, 22px);
  font-weight: 700;
  color: var(--paars);
  margin-bottom: 8px;
}
.progress-bar { display: flex; gap: 6px; }
.seg {
  flex: 1;
  height: 16px;
  border-radius: 4px;
  background: var(--wit);
  overflow: hidden;
  position: relative;
}
.seg::after {
  content: "";
  position: absolute;
  inset: 0;
  transform-origin: left;
  transform: scaleX(0);
  transition: transform .5s var(--ease-out);
}
.seg.done::after    { background: var(--lime);  transform: scaleX(1); }
.seg.current::after { background: var(--paars); transform: scaleX(1); }

.quiz-body {
  margin-top: clamp(18px, 4vh, 48px);
  transition: opacity .28s ease, transform .28s ease;
}
.quiz-body.out { opacity: 0; transform: translateX(-36px); }
.quiz-body.pre { opacity: 0; transform: translateX(36px); transition: none; }

.question {
  margin: 0 0 clamp(18px, 3.4vh, 36px);
  font-size: clamp(26px, min(4.3vw, 5.6vh), 50px);
  line-height: 1.15;
  font-weight: 700;
  color: var(--paars);
  letter-spacing: -.015em;
  text-wrap: balance;
}

.answers { display: grid; gap: clamp(12px, 2vh, 18px); }
.answer {
  display: flex;
  align-items: center;
  gap: clamp(14px, 2vw, 22px);
  width: 100%;
  min-height: clamp(72px, 10.5vh, 104px);
  padding: 14px clamp(16px, 2.4vw, 26px);
  border: 0;
  border-radius: var(--radius);
  background: var(--wit);
  color: var(--paars-diep);
  font-size: clamp(20px, min(3vw, 3.2vh), 28px);
  font-weight: 500;
  line-height: 1.28;
  text-align: left;
  cursor: pointer;
  box-shadow: 0 6px 0 var(--paars-licht);
  transition: transform .09s ease, box-shadow .09s ease, background .3s ease, color .3s ease, opacity .4s ease,
              min-height var(--dur-reveal) var(--ease-smooth), padding var(--dur-reveal) var(--ease-smooth);
  animation: answerIn .5s var(--ease-out) backwards;
  animation-delay: calc(var(--i, 0) * 90ms + 120ms);
}
.answer:active:not(.locked) {
  transform: translateY(5px);
  box-shadow: 0 1px 0 var(--paars-licht);
  background: #f6f1fc;
}
.answer .key {
  flex: none;
  width: clamp(44px, 5.5vh, 56px);
  height: clamp(44px, 5.5vh, 56px);
  border-radius: 12px;
  display: grid;
  place-items: center;
  background: var(--paars);
  color: var(--wit);
  font-weight: 700;
  font-size: clamp(20px, 2.6vh, 26px);
  transition: background .25s;
}
.answer .label { flex: 1; min-width: 0; }
.answer .mark {
  flex: none;
  width: 44px;
  height: 44px;
  display: none;
}
.answer .mark svg { width: 100%; height: 100%; }
.answer.locked { cursor: default; }
.answer.dim { opacity: .42; }
.answer.correct {
  background: var(--lime);
  color: var(--paars-diep);
  box-shadow: 0 6px 0 var(--lime-donker);
  opacity: 1;
}
.answer.correct .key { background: var(--paars-diep); }
.answer.correct .mark { display: block; animation: markIn .45s var(--ease-spring) backwards .1s; }
.answer.correct .mark .x { display: none; }
.answer.correct.chosen { animation: pop .55s var(--ease-spring); }
.answer.wrong {
  background: var(--fout);
  color: var(--wit);
  box-shadow: 0 6px 0 var(--fout-donker);
  animation: shake .5s ease;
}
.answer.wrong .key { background: rgba(0,0,0,.22); }
.answer.wrong .mark { display: block; }
.answer.wrong .mark .v { display: none; }

.feedback-wrap {
  height: 0;
  overflow: hidden;
  transition: height var(--dur-reveal) var(--ease-smooth);
}
.feedback {
  display: none;
  margin-top: clamp(16px, 2.8vh, 30px);
  margin-bottom: 8px;
  padding: clamp(18px, 2.6vh, 28px) clamp(20px, 3vw, 32px);
  border-radius: var(--radius);
  background: var(--wit);
  border-left: 12px solid var(--lime);
  box-shadow: 0 6px 0 var(--paars-licht);
  align-items: flex-end;
  flex-wrap: wrap;
  gap: 18px 28px;
}
.feedback.show {
  display: flex;
  opacity: 0;
  transform: translateY(18px);
  transition: opacity .45s ease .06s, transform var(--dur-reveal) var(--ease-smooth);
}
.feedback.show.in { opacity: 1; transform: none; }
.feedback.bad { border-left-color: var(--fout); }
.feedback-text { flex: 1 1 420px; min-width: 0; }
.feedback-title {
  margin: 0 0 6px;
  font-size: clamp(24px, min(3vw, 3.8vh), 34px);
  font-weight: 700;
  color: var(--paars);
}
.feedback.bad .feedback-title { color: var(--fout-donker); }
.feedback-hint {
  margin: 0 0 6px;
  font-size: clamp(17px, 2vh, 20px);
  font-weight: 500;
  color: var(--fout-donker);
}
.feedback-head {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  column-gap: 14px;
  margin-bottom: 6px;
}
.feedback-head .feedback-title, .feedback-head .feedback-hint { margin: 0; }
/* na het antwoorden: antwoorden iets compacter, zodat de toelichting past */
.quiz-body.measuring .answer { transition-property: transform, box-shadow, background, color, opacity !important; }
.quiz-body.answered .answer { min-height: 64px; padding-top: 10px; padding-bottom: 10px; }
.feedback-why {
  margin: 0 0 12px;
  border-radius: 12px;
  background: #fdecef;
  overflow: hidden;
}
.why-toggle {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  width: 100%;
  min-height: 64px;
  padding: 8px 16px;
  border: 0;
  background: transparent;
  color: var(--fout-donker);
  font-size: clamp(18px, min(2.1vw, 2.7vh), 23px);
  font-weight: 700;
  text-align: left;
  cursor: pointer;
}
.why-toggle:active { background: rgba(184,56,79,.08); }
.why-toggle svg { width: 28px; height: 28px; flex: none; transition: transform .3s var(--ease-out); }
.feedback-why.open .why-toggle svg { transform: rotate(180deg); }
.feedback-why.open .why-text { opacity: 1; transform: none; transition-delay: .06s; }
.why-panel { height: 0; overflow: hidden; transition: height var(--dur-reveal) var(--ease-smooth); }
.why-text {
  margin: 0;
  padding: 0 16px 14px;
  opacity: 0;
  transform: translateY(-8px);
  transition: opacity .35s ease, transform var(--dur-reveal) var(--ease-smooth);

  line-height: 1.42;
  color: var(--paars-diep);
  text-wrap: pretty;
}
.feedback-body {
  margin: 0;
  font-size: clamp(19px, min(2.2vw, 2.8vh), 24px);
  line-height: 1.45;
  color: var(--paars-diep);
  text-wrap: pretty;
}
.feedback .btn { margin-left: auto; }

/* ---------- eindscherm ---------- */
.score-big {
  margin: 0;
  font-size: clamp(56px, min(10vw, 13vh), 128px);
  line-height: 1;
  font-weight: 700;
  color: var(--lime);
  letter-spacing: -.02em;
}
.score-blocks { display: flex; gap: clamp(8px, 1.4vw, 14px); flex-wrap: wrap; justify-content: center; }
.score-block {
  width: clamp(30px, 4.6vh, 44px);
  height: clamp(30px, 4.6vh, 44px);
  border-radius: 6px;
  background: rgba(255,255,255,.18);
  transition: background .2s, transform .2s;
}
.score-block.on { background: var(--lime); animation: blockOn .4s var(--ease-spring); }
.end-title {
  margin: 0;
  font-size: clamp(30px, min(4.4vw, 5.8vh), 54px);
  line-height: 1.1;
  font-weight: 700;
  text-wrap: balance;
}
.end-text {
  margin: 0;
  max-width: 36ch;
  font-size: clamp(20px, min(2.5vw, 3.1vh), 27px);
  line-height: 1.42;
  text-wrap: pretty;
}
#end.active .anim-in { animation: rise .7s var(--ease-out) backwards; }
#end.active .anim-in:nth-child(2) { animation-delay: .1s; }
#end.active .anim-in:nth-child(3) { animation-delay: .2s; }
#end.active .anim-in:nth-child(4) { animation-delay: .9s; }
#end.active .anim-in:nth-child(5) { animation-delay: 1s; }
#end.active .anim-in:nth-child(6) { animation-delay: 1.2s; }
.end-layout {
  display: grid;
  gap: clamp(20px, 3vh, 36px);
  justify-items: center;
  align-items: center;
  max-width: 1200px;
  padding-bottom: clamp(40px, 11vh, 120px);
}
.end-layout .center-stack { padding-bottom: 0; }
.qr-card {
  display: flex;
  align-items: center;
  gap: clamp(16px, 2.4vw, 28px);
  max-width: 560px;
  padding: clamp(14px, 2vh, 22px);
  border-radius: 22px;
  background: var(--wit);
  color: var(--paars-diep);
  box-shadow: 0 6px 0 var(--paars-donker);
  text-align: left;
}
.qr-card img {
  flex: none;
  width: clamp(130px, 19vh, 220px);
  height: auto;
  border-radius: 10px;
  image-rendering: pixelated;
  pointer-events: none;
}
.qr-title { margin: 0 0 6px; font-size: clamp(22px, min(2.6vw, 3.2vh), 30px); font-weight: 700; color: var(--paars); line-height: 1.15; }
.qr-text  { margin: 0; font-size: clamp(18px, min(2.1vw, 2.6vh), 22px); line-height: 1.4; }
#end.active .qr-card.anim-in { animation-delay: 1.1s; }
@media (min-width: 900px) and (min-aspect-ratio: 1/1) {
  .end-layout { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); }
  .qr-card { flex-direction: column; text-align: center; max-width: 380px; }
  .qr-card img { width: clamp(160px, 28vh, 260px); }
}
#end.active .score-big { animation: scorePop .8s var(--ease-spring) backwards .2s; }

/* ---------- confetti ---------- */
#confetti {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 40;
  pointer-events: none;
}

/* ---------- animaties ---------- */
@keyframes rise     { from { opacity: 0; transform: translateY(26px); } }
@keyframes answerIn { from { opacity: 0; transform: translateY(22px) scale(.97); } }
@keyframes feedIn   { from { opacity: 0; transform: translateY(20px); } }
@keyframes pulse    { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.045); } }
@keyframes pop {
  0%   { transform: scale(1); }
  35%  { transform: scale(1.05); }
  65%  { transform: scale(.985); }
  100% { transform: scale(1); }
}
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  15% { transform: translateX(-12px); }
  30% { transform: translateX(10px); }
  45% { transform: translateX(-8px); }
  60% { transform: translateX(6px); }
  75% { transform: translateX(-3px); }
}
@keyframes markIn  { from { opacity: 0; transform: scale(.3) rotate(-20deg); } }
@keyframes blockOn { 0% { transform: scale(.6); } 60% { transform: scale(1.18); } 100% { transform: scale(1); } }
@keyframes scorePop { from { opacity: 0; transform: scale(.5); } }

/* ---------- liggend met weinig hoogte ---------- */
@media (orientation: landscape) and (max-height: 620px) {
  .quiz-body { margin-top: 14px; }
  .logo-small { height: 44px; }
}

/* ---------- minder beweging gewenst ---------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
}
</style>

<canvas id="confetti" aria-hidden="true"></canvas>

<script>
(function () {
  "use strict";

  var T = CONFIG.teksten;
  var VRAGEN = CONFIG.vragen || [];
  var $ = function (id) { return document.getElementById(id); };

  function fmt(str, data) {

          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square" aria-hidden="true">' +

  $("startTitle").textContent = T.startTitel;

  $("againBtnLabel").textContent = T.opnieuwKnop;

  $("soundBtn").title = T.geluidKnop;

  /* ---------------- configuratie controleren ---------------- */
  (function checkConfig() {

    VRAGEN.forEach(function (q, i) {
      var n = (q.antwoorden || []).filter(function (a) { return a.goed === true; }).length;
      if (n === 0) msgs.push("Vraag " + (i + 1) + " heeft geen antwoord met goed: true.");

      var w = $("configWarn");
      w.textContent = "Let op (configuratie): " + msgs.join(" ");
      w.classList.add("show");
    }
  })();

  /* ================================================================

     ================================================================ */

    },
    correct: function () {
      if (!this.ready()) return;
      var notes = [523.25, 659.25, 783.99, 1046.5];
      for (var i = 0; i < notes.length; i++) {
        this.tone(notes[i], i * 0.075, 0.16, "square", 0.07);
        this.tone(notes[i], i * 0.075, 0.22, "triangle", 0.16);

    },
    wrong: function () {
      if (!this.ready()) return;
      this.tone(311, 0, 0.22, "sine", 0.18, 262);

      if (!this.ready()) return;

      for (var i = 0; i < seq.length; i++) {

  var soundBtn = $("soundBtn");

        x: x, y: y, vx: vx, vy: vy,
        s: 7 + Math.random() * 9,
        c: cols[(Math.random() * cols.length) | 0],
        r: Math.random() * Math.PI, vr: (Math.random() - .5) * .3,
        w: Math.random() * Math.PI * 2, vw: .1 + Math.random() * .15,
        life: 0

    }
    function burst(x, y, n) {
      n = Math.round((n || 80) * (reduce ? .3 : 1));
      var cols = colors();
      for (var i = 0; i < n; i++) {
        var a = -Math.PI / 2 + (Math.random() - .5) * Math.PI * 1.1;
        var sp = 7 + Math.random() * 11;
        add(make(x, y, Math.cos(a) * sp, Math.sin(a) * sp, cols));

    }
    function rain(n) {
      n = Math.round((n || 150) * (reduce ? .3 : 1));

      for (var i = 0; i < n; i++) {

      var dt = Math.min(2.5, (now - last) / 16.67); last = now;
      ctx.clearRect(0, 0, W, H);
      for (var i = parts.length - 1; i >= 0; i--) {
        var p = parts[i];
        p.vy += .32 * dt; p.vx *= Math.pow(.985, dt); p.vy = Math.min(p.vy, 9);
        p.x += p.vx * dt; p.y += p.vy * dt;
        p.r += p.vr * dt; p.w += p.vw * dt; p.life += dt;
        if (p.y > H + 40 || p.life > 600) { parts.splice(i, 1); continue; }
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.r);
        ctx.scale(1, Math.max(.15, Math.abs(Math.cos(p.w))));
        ctx.fillStyle = p.c;
        ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s);
        ctx.restore();

      else { running = false; ctx.clearRect(0, 0, W, H); }
    }

    resize();

  })();

  /* ================================================================
     PIXEL-DECORATIE
     ================================================================ */
  function drawPixels(cv) {
    var w = cv.clientWidth, h = cv.clientHeight;
    if (!w || !h) return;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    var c = cv.getContext("2d");
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, w, h);
    var cell = Math.max(9, Math.min(18, Math.round(w / 80)));
    var cols = Math.ceil(w / cell), rows = Math.ceil(h / cell);
    var seed = 20260914;
    function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
    var lime = cssVar("--lime");
    for (var x = 0; x < cols; x++) {
      var wave = .5 + .5 * Math.sin(x * .11) * Math.cos(x * .043 + 1.3);
      var solid = Math.max(1, Math.round(rows * (.1 + .2 * wave)));
      for (var r = 0; r < rows; r++) {
        var on;

        else on = rnd() < .42 * Math.exp(-(r - solid) / 2.2);

          c.fillRect(x * cell, h - (r + 1) * cell, cell, cell);

  function drawAllPixels() {
    var list = document.querySelectorAll(".screen.active .pixels");
    for (var i = 0; i < list.length; i++) drawPixels(list[i]);
  }
  var resizeT;
  window.addEventListener("resize", function () {
    clearTimeout(resizeT);
    resizeT = setTimeout(drawAllPixels, 120);
  });

  /* ================================================================
     SCHERMEN
     ================================================================ */
  var screens = { start: $("start"), quiz: $("quiz"), end: $("end") };
  var current = "start";

  function show(name) {
    for (var k in screens) screens[k].classList.toggle("active", k === name);
    current = name;
    document.body.setAttribute("data-screen", name);
    screens[name].scrollTop = 0;

    if (cv) requestAnimationFrame(function () { drawPixels(cv); });

  }

  /* ================================================================
     QUIZ-LOGICA
     ================================================================ */
  var idx = 0, score = 0, locked = false, endTimers = [];
  var answersEl = $("answers"), feedbackEl = $("feedback"), bodyEl = $("quizBody");

  var REDUCE = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var DUR = REDUCE ? 0 : 500;
  var scrollAnim = 0, revealT = null, wrapEl = $("feedbackWrap");
  function easeOut(t) { return 1 - Math.pow(1 - t, 4); }
  function animateScroll(el, to, dur) {
    var id = ++scrollAnim, from = el.scrollTop, t0 = performance.now();
    if (!dur) { el.scrollTop = to; return; }
    (function step(now) {
      if (id !== scrollAnim) return;
      var t = Math.min(1, (now - t0) / dur);
      el.scrollTop = from + (to - from) * easeOut(t);
      if (t < 1) requestAnimationFrame(step);
    })(t0);
  }
  ["touchstart", "wheel"].forEach(function (ev) {
    document.addEventListener(ev, function () { scrollAnim++; }, { passive: true });
  });

  /* Feedback onthullen: blok groeit, antwoorden krimpen en het scherm scrolt
     in één beweging, met dezelfde duur en curve. */
  function revealFeedback() {
    var sc = screens.quiz;
    clearTimeout(revealT);
    bodyEl.classList.add("measuring", "answered");
    feedbackEl.classList.add("show");
    wrapEl.style.transition = "none";
    wrapEl.style.height = "auto";
    var H = wrapEl.offsetHeight;
    var maxScroll = Math.max(0, sc.scrollHeight - sc.clientHeight);
    var need = sc.scrollTop + wrapEl.getBoundingClientRect().bottom - sc.getBoundingClientRect().top + 16 - sc.clientHeight;
    var target = Math.min(maxScroll, Math.max(sc.scrollTop, need));
    bodyEl.classList.remove("answered");
    wrapEl.style.height = "0px";
    void wrapEl.offsetHeight;
    bodyEl.classList.remove("measuring");
    wrapEl.style.transition = "";
    requestAnimationFrame(function () {
      bodyEl.classList.add("answered");
      wrapEl.style.height = H + "px";
      feedbackEl.classList.add("in");
      if (target > sc.scrollTop + 1) animateScroll(sc, target, DUR);
    });
    revealT = setTimeout(function () { wrapEl.style.height = "auto"; }, DUR + 80);
  }

  var MARK_SVG =
    '<svg viewBox="0 0 44 44" aria-hidden="true">' +
    '<g class="v"><circle cx="22" cy="22" r="20" fill="currentColor"/><path d="M12 22.5l6.5 6.5L32 15.5" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--lime)"/></g>' +
    '<g class="x"><circle cx="22" cy="22" r="20" fill="rgba(0,0,0,.2)"/><path d="M15 15l14 14M29 15L15 29" stroke="#fff" stroke-width="5" stroke-linecap="round"/></g>' +
    '</svg>';

  function buildProgress() {
    var bar = $("progressBar");
    bar.innerHTML = "";
    for (var i = 0; i < VRAGEN.length; i++) {
      var s = document.createElement("div");
      s.className = "seg";
      bar.appendChild(s);
    }
  }
  function updateProgress() {
    $("progressLabel").textContent = fmt(T.voortgang, { nummer: idx + 1, totaal: VRAGEN.length });
    var segs = $("progressBar").children;
    for (var i = 0; i < segs.length; i++) {
      segs[i].classList.toggle("done", i < idx);
      segs[i].classList.toggle("current", i === idx);
    }
  }

  function renderQuestion() {
    var q = VRAGEN[idx];
    locked = false;
    updateProgress();
    $("questionText").textContent = q.vraag;
    feedbackEl.classList.remove("show", "good", "bad", "in");
    bodyEl.classList.remove("answered");
    clearTimeout(revealT);
    wrapEl.style.transition = "none";
    wrapEl.style.height = "0px";
    void wrapEl.offsetHeight;
    wrapEl.style.transition = "";
    answersEl.innerHTML = "";
    var letters = "ABCDEFGH";
    shuffle(q.antwoorden).forEach(function (a, i) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "answer";
      b.style.setProperty("--i", i);
      b._goed = a.goed === true;
      b._uitleg = a.uitleg || "";
      var key = document.createElement("span"); key.className = "key"; key.textContent = letters[i];
      var lab = document.createElement("span"); lab.className = "label"; lab.textContent = a.tekst;
      var mark = document.createElement("span"); mark.className = "mark"; mark.innerHTML = MARK_SVG;
      b.appendChild(key); b.appendChild(lab); b.appendChild(mark);
      b.addEventListener("click", function () { choose(b); });
      answersEl.appendChild(b);
    });
  }

  function choose(btn) {
    if (locked) return;
    locked = true;
    var good = btn._goed;
    var all = answersEl.querySelectorAll(".answer");
    for (var i = 0; i < all.length; i++) {
      var b = all[i];
      b.classList.add("locked");
      if (b._goed) b.classList.add("correct");
      else if (b !== btn) b.classList.add("dim");
    }
    btn.classList.add("chosen");
    if (good) {
      score++;
      Sound.correct();
      var r = btn.getBoundingClientRect();
      Confetti.burst(r.left + r.width / 2, r.top + r.height / 2, 90);
    } else {
      btn.classList.add("wrong");
      Sound.wrong();
    }

    var q = VRAGEN[idx];
    feedbackEl.classList.add(good ? "good" : "bad");
    $("feedbackTitle").textContent = good ? T.goedTitel : T.foutTitel;
    $("feedbackHint").textContent = good ? "" : T.foutHint;
    $("feedbackHint").style.display = good || !T.foutHint ? "none" : "";
    var why = $("feedbackWhy");
    why.classList.remove("open");
    $("whyPanel").style.height = "0px";
    $("whyToggle").setAttribute("aria-expanded", "false");
    if (!good && btn._uitleg) {
      $("whyLabel").textContent = T.waaromNiet || "Waarom niet?";
      $("whyText").textContent = btn._uitleg;
      why.style.display = "";
    } else {
      why.style.display = "none";
    }
    $("feedbackBody").textContent = q.toelichting || "";
    $("nextBtnLabel").textContent = idx === VRAGEN.length - 1 ? T.laatsteKnop : T.volgendeKnop;
    revealFeedback();
  }

  function next() {
    Sound.tap();
    if (idx >= VRAGEN.length - 1) { showEnd(); return; }
    idx++;
    bodyEl.classList.add("out");
    setTimeout(function () {
      screens.quiz.scrollTop = 0;
      renderQuestion();
      bodyEl.classList.remove("out");
      bodyEl.classList.add("pre");
      void bodyEl.offsetWidth;
      bodyEl.classList.remove("pre");
    }, 280);
  }

  function startQuiz() {
    Sound.unlock();
    Sound.tap();
    clearEndTimers();
    Confetti.clear();
    idx = 0; score = 0;
    buildProgress();
    renderQuestion();
    show("quiz");
  }

  function clearEndTimers() {
    endTimers.forEach(clearTimeout);
    endTimers = [];
  }

  function showEnd() {
    var total = VRAGEN.length;
    $("scoreBig").textContent = fmt(T.scoreTekst, { score: score, totaal: total });
    var range = null;
    (CONFIG.scores || []).forEach(function (s) {
      if (score >= s.vanaf && score <= s.totEnMet) range = s;
    });
    if (!range) range = (CONFIG.scores || [])[CONFIG.scores.length - 1] || { titel: "", tekst: "" };
    $("endTitle").textContent = range.titel;
    $("endText").textContent = range.tekst;

    var blocks = $("scoreBlocks");
    blocks.innerHTML = "";
    for (var i = 0; i < total; i++) {
      var d = document.createElement("div");
      d.className = "score-block";
      blocks.appendChild(d);
    }
    show("end");

    clearEndTimers();
    for (var j = 0; j < score; j++) {
      (function (n) {
        endTimers.push(setTimeout(function () {
          blocks.children[n].classList.add("on");
          Sound.blip(n);
        }, 450 + n * 170));
      })(j);
    }
    if (score >= CONFIG.confettiVanafScore) {
      endTimers.push(setTimeout(function () {
        Sound.fanfare();
        Confetti.rain(170);
        Confetti.burst(window.innerWidth * .2, window.innerHeight * .75, 60);
        Confetti.burst(window.innerWidth * .8, window.innerHeight * .75, 60);
      }, 450 + score * 170));
    }
  }

  function goHome() {
    clearEndTimers();
    Confetti.clear();
    idx = 0; score = 0; locked = false;
    show("start");
  }

  $("startBtn").addEventListener("click", startQuiz);
  $("againBtn").addEventListener("click", startQuiz);
  $("nextBtn").addEventListener("click", next);
  $("whyPanel").addEventListener("transitionend", function (e) {
    if (e.propertyName === "height" && $("feedbackWhy").classList.contains("open")) this.style.height = "auto";
  });
  $("whyToggle").addEventListener("click", function () {
    var w = $("feedbackWhy"), panel = $("whyPanel"), sc = screens.quiz;
    var open = !w.classList.contains("open");
    clearTimeout(revealT);
    wrapEl.style.height = "auto";
    this.setAttribute("aria-expanded", open ? "true" : "false");
    Sound.tap();
    if (open) {
      var h = panel.firstElementChild.offsetHeight;
      w.classList.add("open");
      panel.style.height = h + "px";
      var need = sc.scrollTop + feedbackEl.getBoundingClientRect().bottom - sc.getBoundingClientRect().top + h + 24 - sc.clientHeight;
      if (need > sc.scrollTop + 1) animateScroll(sc, need, DUR);
    } else {
      panel.style.height = panel.offsetHeight + "px";
      void panel.offsetHeight;
      w.classList.remove("open");
      panel.style.height = "0px";
    }
  });

  /* QR-code op het eindscherm */
  (function () {
    var q = (typeof QR_BASE64 === "string" ? QR_BASE64 : "").replace(/\s+/g, "");
    if (!q) { $("qrCard").style.display = "none"; return; }
    if (q.indexOf("data:") !== 0) q = "data:image/png;base64," + q;
    $("qrImg").src = q;
    $("qrTitle").textContent = T.qrTitel || "";
    $("qrText").textContent = T.qrTekst || "";
  })();

  /* ================================================================
     INACTIVITEIT
     ================================================================ */
  var idleTimer = null;
  function resetIdle() {
    clearTimeout(idleTimer);
    if (current === "start") return;
    idleTimer = setTimeout(goHome, (CONFIG.inactiviteitSeconden || 60) * 1000);
  }
  ["pointerdown", "touchstart", "keydown", "wheel"].forEach(function (ev) {
    document.addEventListener(ev, resetIdle, { capture: true, passive: true });
  });

  /* ================================================================
     TOUCH: geen zoom, geen scrollen buiten de schermen, geen menu
     ================================================================ */
  document.addEventListener("pointerdown", function () { Sound.unlock(); }, { capture: true, passive: true });
  document.addEventListener("touchstart", function () {}, { passive: true });
  document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
  document.addEventListener("gesturechange", function (e) { e.preventDefault(); });
  document.addEventListener("dblclick", function (e) { e.preventDefault(); });
  document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  document.addEventListener("selectstart", function (e) { e.preventDefault(); });
  document.addEventListener("dragstart", function (e) { e.preventDefault(); });
  document.addEventListener("touchmove", function (e) {
    if (e.touches && e.touches.length > 1) { e.preventDefault(); return; }
    var s = e.target.closest ? e.target.closest(".screen") : null;
    if (!s || s.scrollHeight <= s.clientHeight + 1) e.preventDefault();
  }, { passive: false });
  var lastTouchEnd = 0;
  document.addEventListener("touchend", function (e) {
    var now = Date.now();
    if (now - lastTouchEnd < 300 && !(e.target.closest && e.target.closest("button"))) e.preventDefault();
    lastTouchEnd = now;
  }, { passive: false });

  /* houd de container altijd op zijn plek (focus kan hem anders verschuiven) */
  var appEl = $("app");
  appEl.addEventListener("scroll", function () { appEl.scrollTop = 0; appEl.scrollLeft = 0; });
  window.addEventListener("scroll", function () { if (window.scrollY || window.scrollX) window.scrollTo(0, 0); });

  /* ---------------- start ---------------- */
  show("start");
})();
</script>
